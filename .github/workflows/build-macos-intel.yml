name: Build Intel macOS (x64)

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-x64:
    name: Build macOS Intel (x86_64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install compilation targets
        run: |
          rustup target add x86_64-apple-darwin wasm32-wasip2
          rustup show

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-apple-darwin

      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8 --locked

      - name: Read and verify version
        id: version
        shell: bash
        run: bash scripts/release-version.sh

      - name: Build the app, daemon and command-line client
        env:
          KOPUZ_FLAVOR: ${{ steps.version.outputs.flavor }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --locked --target x86_64-apple-darwin -p kopuz -p kopuz-kopuzd -p kopuz-ctl

      - name: Name the binaries for Kopuz Nightly
        if: steps.version.outputs.nightly == 'true'
        run: |
          for binary in kopuz kopuzd kopuzctl; do
            cp "target/x86_64-apple-darwin/release/${binary}" "target/x86_64-apple-darwin/release/${binary}-nightly"
          done

      - name: Bundle macOS Intel application
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NIGHTLY: ${{ steps.version.outputs.nightly }}
        run: |
          set -euo pipefail

          if [[ "$NIGHTLY" == true ]]; then
            config=packaging/kopuz-nightly/kopuz-nightly.ci.toml
            sed \
              -e "s/@VERSION@/${VERSION}/" \
              -e "s|../../target/release|../../target/x86_64-apple-darwin/release|" \
              packaging/kopuz-nightly/kopuz-nightly.toml > "$config"
            cargo packager --config "$config" --release --target x86_64-apple-darwin -f app --out-dir "$PWD/dist"
          else
            cargo packager -p kopuz --release --target x86_64-apple-darwin -f app --out-dir "$PWD/dist"
          fi

      - name: Verify application bundle and architecture
        shell: bash
        env:
          PRODUCT: ${{ steps.version.outputs.product }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          set -euo pipefail

          app="dist/${PRODUCT}.app"
          if [[ ! -d "$app" ]]; then
            echo "Error: ${app} was not found in dist/"
            exit 1
          fi

          for binary in kopuzd kopuzctl kopuz; do
            bin_path="${app}/Contents/MacOS/${binary}${SUFFIX}"
            if [[ ! -x "$bin_path" ]]; then
              echo "Error: Executable not found at ${bin_path}"
              exit 1
            fi
            echo "Inspecting architecture of ${bin_path}:"
            lipo -info "$bin_path"
            file "$bin_path"
            if ! file "$bin_path" | grep -q "x86_64"; then
              echo "Error: ${bin_path} is not an x86_64 executable!"
              exit 1
            fi
          done

      # Inside-out: the helpers first, then the bundle that seals them, never --deep.
      - name: Apply ad-hoc signature
        shell: bash
        env:
          PRODUCT: ${{ steps.version.outputs.product }}
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          set -euo pipefail

          app="dist/${PRODUCT}.app"
          for binary in kopuzd kopuzctl kopuz; do
            codesign --force --sign - "${app}/Contents/MacOS/${binary}${SUFFIX}"
          done
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Free disk space for DMG
        run: |
          cargo clean
          df -h /

      - name: Create DMG and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRODUCT: ${{ steps.version.outputs.product }}
          ASSET: ${{ steps.version.outputs.asset }}
        run: |
          set -euo pipefail

          dmg="dist/${ASSET}_${VERSION}_x86_64.dmg"
          hdiutil create -volname "$PRODUCT" -srcfolder "dist/${PRODUCT}.app" -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          shasum -a 256 "$dmg" > "${dmg}.sha256"

      - name: Upload Intel macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.nightly == 'true' && 'kopuz-nightly-macos-x64' || format('kopuz-release-macos-x64-{0}', steps.version.outputs.version) }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease != 'true' }}
          fail_on_unmatched_files: false
          files: |
            dist/*_x86_64.dmg
            dist/*_x86_64.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
